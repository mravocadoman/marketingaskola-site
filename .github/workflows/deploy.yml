name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # While the site lives on the github.io project URL it is built with a
      # path prefix and marked noindex. On custom-domain cutover:
      #   1. set PATH_PREFIX to /
      #   2. delete the PREVIEW env line
      #   3. add a CNAME file (see README)
      - run: npx @11ty/eleventy --pathprefix="$PATH_PREFIX"
        env:
          PATH_PREFIX: /marketingaskola-site/
          PREVIEW: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
