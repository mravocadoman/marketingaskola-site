name: Deploy

# main -> SiteGround (marketingaskola.lv) once the SG_* secrets exist;
# until then, and for previews, -> GitHub Pages at the /marketingaskola-site/
# prefix with noindex. See docs/siteground-cutover.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        default: auto
        options: [auto, siteground, pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      siteground: ${{ steps.pick.outputs.siteground }}
      pages: ${{ steps.pick.outputs.pages }}
    steps:
      - id: pick
        env:
          HAS_SG: ${{ secrets.SG_HOST != '' && secrets.SG_USER != '' && secrets.SG_SSH_KEY != '' && secrets.SG_PATH != '' }}
          TARGET: ${{ inputs.target || 'auto' }}
        run: |
          if [ "$TARGET" = "siteground" ] || { [ "$TARGET" = "auto" ] && [ "$HAS_SG" = "true" ]; }; then
            echo "siteground=true" >> "$GITHUB_OUTPUT"; echo "pages=false" >> "$GITHUB_OUTPUT"
          else
            echo "siteground=false" >> "$GITHUB_OUTPUT"; echo "pages=true" >> "$GITHUB_OUTPUT"
          fi
          echo "target=$TARGET has_siteground_secrets=$HAS_SG"

  siteground:
    needs: route
    if: needs.route.outputs.siteground == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marketingaskola.lv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @11ty/eleventy
      - run: npm run check
      - name: SSH key
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT || '18765' }}
          SG_USER: ${{ secrets.SG_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # keyscan exits 1 when the host does not answer in time (SiteGround
          # throttles unknown IPs now and then); retry, then fall back to
          # accept-new on the first real connection instead of failing here.
          for i in 1 2 3; do ssh-keyscan -T 20 -p "$SG_PORT" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 15; done
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 30\n  ServerAliveInterval 15\n' > ~/.ssh/config
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -p "$SG_PORT" "$SG_USER@$SG_HOST" 'echo ssh ok'; then break; fi
            echo "ssh attempt $i failed; retrying in 20s"; sleep 20
            [ "$i" = 5 ] && { echo "::error::could not reach $SG_HOST:$SG_PORT"; exit 1; }
          done
      - name: rsync _site to the web root
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT || '18765' }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          # --delete makes the web root mirror _site/ exactly: this is what
          # removes WordPress. .well-known stays (Let's Encrypt renewals).
          rsync -az --delete --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p $SG_PORT" \
            _site/ "$SG_USER@$SG_HOST:$SG_PATH/"
      - name: Verify the upload over SSH
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT || '18765' }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          local_n=$(find _site -type f | wc -l | tr -d ' ')
          remote=$(ssh -i ~/.ssh/deploy_key -p "$SG_PORT" "$SG_USER@$SG_HOST" \
            "cd '$SG_PATH' && echo \"files=\$(find . -type f -not -path './.well-known/*' | wc -l | tr -d ' ') index=\$(test -f index.html && echo ok) htaccess=\$(test -f .htaccess && echo ok) css=\$(md5sum css/style.css | cut -c1-8)\"")
          echo "local files=$local_n; remote $remote; local css=$(md5sum _site/css/style.css | cut -c1-8)"
          case "$remote" in *"files=$local_n "*"index=ok"*"htaccess=ok"*) echo "upload verified";; *) echo "::error::web root does not match the build"; exit 1;; esac
      - name: Flush SiteGround's dynamic cache
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT || '18765' }}
          SG_USER: ${{ secrets.SG_USER }}
        run: |
          # SuperCacher keeps serving the previous HTML until flushed; the
          # server-side Site Tools CLI does it without the dashboard.
          ssh -i ~/.ssh/deploy_key -p "$SG_PORT" "$SG_USER@$SG_HOST" \
            "site-tools-client domain-all update id=1 flush_cache=1"
      - name: Smoke test the live site
        run: |
          set +e
          BASE=https://marketingaskola.lv node tools/check-live.mjs
          code=$?
          if [ "$code" = "3" ]; then echo "::warning::SiteGround's bot challenge blocked the runner; run 'npm run check:live' from a normal network to verify."; exit 0; fi
          exit $code

  pages-build:
    needs: route
    if: needs.route.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @11ty/eleventy --pathprefix="$PATH_PREFIX"
        env:
          PATH_PREFIX: /marketingaskola-site/
          PREVIEW: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
